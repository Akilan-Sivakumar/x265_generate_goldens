name: Bitexact Output Check (x86 / ARM)

# Manually trigger with the PR number you want to verify.
# Runs on native x86_64 and native arm64 GitHub-hosted runners so no
# cross-compilation or emulation is needed for either architecture.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to test against master (e.g. 956)'
        required: true
        type: string
      base_ref:
        description: 'Base branch to compare against'
        required: false
        default: 'master'
        type: string

jobs:
  bitexact:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            asm_flags: "sse2 sse3 ssse3 sse4 avx avx2"
          - arch: aarch64
            runner: ubuntu-24.04-arm
            asm_flags: "neon"
    runs-on: ${{ matrix.runner }}
    name: bitexact-${{ matrix.arch }}

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build nasm gcc g++ ffmpeg git

      # ---- Checkout base (unpatched) source ----
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          repository: Multicorewareinc/x265
          ref: ${{ github.event.inputs.base_ref }}
          path: base-src

      # ---- Checkout PR (patched) source ----
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          repository: Multicorewareinc/x265
          ref: refs/pull/${{ github.event.inputs.pr_number }}/head
          path: pr-src

      # ---- Build base binary ----
      - name: Build base x265
        run: |
          cmake -S base-src/source -B base-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build base-build --parallel

      # ---- Build patched binary ----
      - name: Build PR x265
        run: |
          cmake -S pr-src/source -B pr-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build pr-build --parallel

      # ---- Generate deterministic raw test clips ----
      # Using ffmpeg testsrc/mandelbrot patterns gives varied spatial detail
      # (including edge/boundary pixels at i=0, which is what this fix touches)
      # without needing to fetch external test assets.
      - name: Generate test clips
        run: |
          mkdir -p clips
          ffmpeg -f lavfi -i testsrc=size=416x240:rate=25:duration=2 \
            -pix_fmt yuv420p clips/testsrc_416x240.yuv -y
          ffmpeg -f lavfi -i mandelbrot=size=832x480:rate=25 -t 2 \
            -pix_fmt yuv420p clips/mandelbrot_832x480.yuv -y
          ffmpeg -f lavfi -i testsrc=size=64x64:rate=25:duration=1 \
            -pix_fmt yuv420p clips/tiny_64x64.yuv -y

      # ---- Encode with each asm path on both binaries, then diff ----
      # NOTE: no `set -e` here on purpose. x265 CLI encode calls can fail
      # (bad args, unsupported combo, etc.) and we want to SEE that failure
      # and its log, not have the whole job die silently on the spot.
      - name: Encode and compare (per asm path, per clip, per preset)
        run: |
          BASE_BIN=./base-build/x265
          PR_BIN=./pr-build/x265
          FAIL=0

          # "0" disables all SIMD detection in x265 (pure C fallback).
          # The literal string "none" is NOT a valid --asm value and will
          # cause x265 to exit non-zero.
          for asm in ${{ matrix.asm_flags }} "0"; do
            for clip in clips/*.yuv; do
              name=$(basename "$clip" .yuv)
              res="${name##*_}"
              width="${res%x*}"
              height="${res#*x}"

              for preset in ultrafast medium veryslow; do
                out_base="out_${name}_${asm}_${preset}_base.hevc"
                out_pr="out_${name}_${asm}_${preset}_pr.hevc"
                log_base="log_${name}_${asm}_${preset}_base.txt"
                log_pr="log_${name}_${asm}_${preset}_pr.txt"

                $BASE_BIN --input "$clip" --input-res "${width}x${height}" \
                  --fps 25 --preset "$preset" --asm "$asm" \
                  -o "$out_base" > "$log_base" 2>&1
                base_rc=$?

                $PR_BIN --input "$clip" --input-res "${width}x${height}" \
                  --fps 25 --preset "$preset" --asm "$asm" \
                  -o "$out_pr" > "$log_pr" 2>&1
                pr_rc=$?

                if [ "$base_rc" -ne 0 ] || [ "$pr_rc" -ne 0 ]; then
                  echo "::error::ENCODE FAILED clip=$name asm=$asm preset=$preset base_rc=$base_rc pr_rc=$pr_rc"
                  echo "---- base log ($log_base) ----"; cat "$log_base"
                  echo "---- pr log ($log_pr) ----"; cat "$log_pr"
                  FAIL=1
                  continue
                fi

                base_sum=$(sha256sum "$out_base" | awk '{print $1}')
                pr_sum=$(sha256sum "$out_pr" | awk '{print $1}')

                if [ "$base_sum" != "$pr_sum" ]; then
                  echo "::error::MISMATCH clip=$name asm=$asm preset=$preset base=$base_sum pr=$pr_sum"
                  FAIL=1
                else
                  echo "OK  clip=$name asm=$asm preset=$preset sha256=$base_sum"
                fi
              done
            done
          done

          if [ "$FAIL" -ne 0 ]; then
            echo "One or more asm/preset/clip combinations failed or produced different output."
            exit 1
          fi
          echo "All combinations bitexact between ${{ github.event.inputs.base_ref }} and PR #${{ github.event.inputs.pr_number }} on ${{ matrix.arch }}."

      # ---- Keep encoded outputs + logs for inspection if something fails ----
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bitexact-mismatch-${{ matrix.arch }}
          path: |
            out_*.hevc
            log_*.txt
          retention-days: 7
