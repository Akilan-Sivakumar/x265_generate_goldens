name: X265 Golden Regeneration

# Manually triggered. Builds x265 at a pinned commit, runs the smoke-test
# harness with an EMPTY golden directory, generates fresh goldens, and
# packages the result as goldens-linux.tar.gz / goldens-windows.tar.gz.

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "x265 commit SHA to build and generate goldens from"
        required: true
        default: "6fabdd5744a818d0caa7557d21a20b2458ec3ddf"
      platforms:
        description: "Which platform(s) to regenerate"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - linux
          - windows

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive
  X265_COMMIT: ${{ github.event.inputs.commit_sha }}

defaults:
  run:
    shell: bash

jobs:

  # ───────────────────────────────────────────────────────────────────────
  # Prepare smoke-test assets.
  #
  # Goldens are deliberately NOT downloaded because the golden directory
  # must start empty so that the harness generates fresh goldens.
  # ───────────────────────────────────────────────────────────────────────
  prep-assets:
    name: "Prepare Assets (no goldens)"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Azure login (OIDC)
        uses: azure/login@v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Download smoke assets (excluding goldens)
        env:
          ONEDRIVE_USER: ${{ secrets.ONEDRIVE_USER }}
          ONEDRIVE_FILE_PATH: ${{ secrets.ONEDRIVE_FILE_PATH }}
        run: |
          set -euo pipefail

          mkdir -p assets

          TOKEN=$(az account get-access-token \
            --resource https://graph.microsoft.com \
            --query accessToken \
            -o tsv)

          if [ -z "$TOKEN" ]; then
            echo "::error::Failed to obtain Graph API token"
            exit 1
          fi

          download_asset() {
            local filename="$1"

            echo "=== Downloading $filename ==="

            curl -sfL \
              -H "Authorization: Bearer ${TOKEN}" \
              "https://graph.microsoft.com/v1.0/users/${ONEDRIVE_USER}/drive/root:/${ONEDRIVE_FILE_PATH}/${filename}:/content" \
              -o "assets/$filename"

            echo "[OK] $filename downloaded"
          }

          download_asset "videos.tar.gz"
          download_asset "decoders-linux.tar.gz"
          download_asset "decoders-windows.tar.gz"
          download_asset "conf.tar.gz"
          download_asset "smoke-tests.tar.gz"

          echo "[INFO] Skipped goldens-linux.tar.gz / goldens-windows.tar.gz"
          echo "[INFO] Golden directory will start empty."

      - name: Upload assets artifact
        uses: actions/upload-artifact@v7
        with:
          name: golden-gen-assets
          path: assets/*.tar.gz
          retention-days: 1


  # ───────────────────────────────────────────────────────────────────────
  # Linux builds
  # ───────────────────────────────────────────────────────────────────────
  build-linux:
    name: "Build Linux (${{ matrix.variant }}, ${{ matrix.config }})"
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        variant:
          - 8bit
          - 10bit
          - 12bit

        config:
          - Release
          - Debug

        include:
          - variant: multilib-12bit-component
            config: Release

          - variant: multilib-10bit-component
            config: Release

    steps:

      - name: Checkout x265
        uses: actions/checkout@v6
        with:
          repository: Multicorewareinc/x265
          ref: ${{ env.X265_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify x265 commit
        run: |
          set -euo pipefail

          echo "Requested x265 commit:"
          echo "$X265_COMMIT"

          echo "Checked out commit:"
          git rev-parse HEAD

          if [ "$(git rev-parse HEAD)" != "$X265_COMMIT" ]; then
            echo "::error::Checked out commit does not match requested commit"
            exit 1
          fi

          echo "[OK] x265 at commit:"
          git log -1 --oneline

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-golden-linux-${{ matrix.variant }}-${{ matrix.config }}-${{ env.X265_COMMIT }}
          restore-keys: |
            ccache-golden-linux-${{ matrix.variant }}-${{ matrix.config }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            cmake \
            nasm \
            ccache \
            libnuma-dev

      - name: Build 8-bit
        if: matrix.variant == '8bit'
        run: |
          set -euo pipefail

          export PATH="/usr/lib/ccache:$PATH"

          mkdir -p build/8bit
          cd build/8bit

          cmake ../../source \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DENABLE_SHARED=OFF \
            -DENABLE_CLI=ON \
            -DENABLE_ASSEMBLY=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

          make -j"$(nproc)"

          test -f x265
          ./x265 --version

      - name: Build 10-bit
        if: matrix.variant == '10bit'
        run: |
          set -euo pipefail

          export PATH="/usr/lib/ccache:$PATH"

          mkdir -p build/10bit
          cd build/10bit

          cmake ../../source \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DHIGH_BIT_DEPTH=ON \
            -DENABLE_SHARED=OFF \
            -DENABLE_CLI=ON \
            -DENABLE_ASSEMBLY=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

          make -j"$(nproc)"

          test -f x265
          ./x265 --version

      - name: Build 12-bit
        if: matrix.variant == '12bit'
        run: |
          set -euo pipefail

          export PATH="/usr/lib/ccache:$PATH"

          mkdir -p build/12bit
          cd build/12bit

          cmake ../../source \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DHIGH_BIT_DEPTH=ON \
            -DMAIN12=ON \
            -DENABLE_SHARED=OFF \
            -DENABLE_CLI=ON \
            -DENABLE_ASSEMBLY=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

          make -j"$(nproc)"

          test -f x265
          ./x265 --version

      - name: Build multilib 12-bit component
        if: matrix.variant == 'multilib-12bit-component'
        run: |
          set -euo pipefail

          export PATH="/usr/lib/ccache:$PATH"

          mkdir -p build/multilib/12bit
          cd build/multilib/12bit

          cmake ../../../source \
            -DCMAKE_BUILD_TYPE=Release \
            -DHIGH_BIT_DEPTH=ON \
            -DMAIN12=ON \
            -DENABLE_SHARED=OFF \
            -DENABLE_CLI=OFF \
            -DEXPORT_C_API=OFF \
            -DENABLE_ASSEMBLY=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

          make -j"$(nproc)"

      - name: Build multilib 10-bit component
        if: matrix.variant == 'multilib-10bit-component'
        run: |
          set -euo pipefail

          export PATH="/usr/lib/ccache:$PATH"

          mkdir -p build/multilib/10bit
          cd build/multilib/10bit

          cmake ../../../source \
            -DCMAKE_BUILD_TYPE=Release \
            -DHIGH_BIT_DEPTH=ON \
            -DENABLE_SHARED=OFF \
            -DENABLE_CLI=OFF \
            -DEXPORT_C_API=OFF \
            -DENABLE_ASSEMBLY=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

          make -j"$(nproc)"

      - name: Upload 8-bit artifact
        if: matrix.variant == '8bit'
        uses: actions/upload-artifact@v7
        with:
          name: golden-x265-linux-8bit${{ matrix.config == 'Debug' && '-debug' || '' }}
          path: build/8bit/x265
          retention-days: 3

      - name: Upload 10-bit artifact
        if: matrix.variant == '10bit'
        uses: actions/upload-artifact@v7
        with:
          name: golden-x265-linux-10bit${{ matrix.config == 'Debug' && '-debug' || '' }}
          path: build/10bit/x265
          retention-days: 3

      - name: Upload 12-bit artifact
        if: matrix.variant == '12bit'
        uses: actions/upload-artifact@v7
        with:
          name: golden-x265-linux-12bit${{ matrix.config == 'Debug' && '-debug' || '' }}
          path: build/12bit/x265
          retention-days: 3

      - name: Upload multilib 12-bit component lib
        if: matrix.variant == 'multilib-12bit-component'
        uses: actions/upload-artifact@v7
        with:
          name: golden-x265-linux-multilib-12bit-lib
          path: build/multilib/12bit/libx265.a
          retention-days: 3

      - name: Upload multilib 10-bit component lib
        if: matrix.variant == 'multilib-10bit-component'
        uses: actions/upload-artifact@v7
        with:
          name: golden-x265-linux-multilib-10bit-lib
          path: build/multilib/10bit/libx265.a
          retention-days: 3


  # ───────────────────────────────────────────────────────────────────────
  # Linux multilib linked build
  # ───────────────────────────────────────────────────────────────────────
  build-linux-multilib:
    name: "Build Linux (multilib, linked)"
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    needs: build-linux

    steps:

      - name: Checkout x265
        uses: actions/checkout@v6
        with:
          repository: Multicorewareinc/x265
          ref: ${{ env.X265_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-golden-linux-multilib-${{ env.X265_COMMIT }}
          restore-keys: |
            ccache-golden-linux-multilib-

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            cmake \
            nasm \
            ccache \
            libnuma-dev

      - name: Download 12-bit component lib
        uses: actions/download-artifact@v8
        with:
          name: golden-x265-linux-multilib-12bit-lib
          path: build/multilib/12bit

      - name: Download 10-bit component lib
        uses: actions/download-artifact@v8
        with:
          name: golden-x265-linux-multilib-10bit-lib
          path: build/multilib/10bit

      - name: Build multilib 8-bit (linked)
        run: |
          set -euo pipefail

          export PATH="/usr/lib/ccache:$PATH"

          mkdir -p build/multilib/8bit
          cd build/multilib/8bit

          ln -sf ../../multilib/10bit/libx265.a libx265_main10.a
          ln -sf ../../multilib/12bit/libx265.a libx265_main12.a

          cmake ../../../source \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SHARED=ON \
            -DENABLE_CLI=ON \
            -DENABLE_ASSEMBLY=ON \
            -DEXTRA_LIB="x265_main10.a;x265_main12.a" \
            -DEXTRA_LINK_FLAGS="-L." \
            -DLINKED_10BIT=ON \
            -DLINKED_12BIT=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

          make -j"$(nproc)"

          test -f x265
          ./x265 --version

      - name: Upload multilib artifact
        uses: actions/upload-artifact@v7
        with:
          name: golden-x265-linux-multilib
          path: |
            build/multilib/8bit/x265
            build/multilib/8bit/libx265.so*
          retention-days: 3


  # ───────────────────────────────────────────────────────────────────────
  # Windows builds
  # ───────────────────────────────────────────────────────────────────────
  build-windows:
    name: "Build Windows (${{ matrix.variant }}, ${{ matrix.config }})"
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      SCCACHE_DIR: ${{ github.workspace }}\sccache_cache
      SCCACHE_CACHE_SIZE: 2G

    strategy:
      fail-fast: false
      matrix:
        variant:
          - 8bit
          - 10bit
          - 12bit

        config:
          - Release
          - Debug

        include:
          - variant: multilib-12bit-component
            config: Release

          - variant: multilib-10bit-component
            config: Release

    steps:

      - name: Checkout x265
        uses: actions/checkout@v6
        with:
          repository: Multicorewareinc/x265
          ref: ${{ env.X265_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify x265 commit
        shell: bash
        run: |
          set -euo pipefail

          echo "Requested x265 commit:"
          echo "$X265_COMMIT"

          echo "Checked out commit:"
          git rev-parse HEAD

          if [ "$(git rev-parse HEAD)" != "$X265_COMMIT" ]; then
            echo "::error::Checked out commit does not match requested commit"
            exit 1
          fi

          echo "[OK] x265 at commit:"
          git log -1 --oneline

      - name: Cache sccache
        uses: actions/cache@v5
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-golden-windows-${{ matrix.variant }}-${{ matrix.config }}-${{ env.X265_COMMIT }}
          restore-keys: |
            sccache-golden-windows-${{ matrix.variant }}-${{ matrix.config }}-

      - name: Install sccache
        shell: pwsh
        env:
          SCCACHE_VERSION: "0.17.0"
        run: |
          $url = "https://github.com/mozilla/sccache/releases/download/v$($env:SCCACHE_VERSION)/sccache-v$($env:SCCACHE_VERSION)-x86_64-pc-windows-msvc.tar.gz"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile sccache.tar.gz

          tar -xzf sccache.tar.gz

          $sccacheDir = (Get-ChildItem -Directory -Filter "sccache-*").FullName

          echo "$sccacheDir" |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

          & "$sccacheDir\sccache.exe" --start-server

      - name: Install nasm
        shell: pwsh
        run: |
          choco install nasm -y

          $nasmPath = "C:\Program Files\NASM"

          if (Test-Path $nasmPath) {
            echo "$nasmPath" |
              Out-File `
                -FilePath $env:GITHUB_PATH `
                -Encoding utf8 `
                -Append
          }

      - name: Build 8-bit
        if: matrix.variant == '8bit'
        shell: pwsh
        run: |
          $nasmPath = "C:\Program Files\NASM"

          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -property installationPath

          $vcvars = "$vsPath\VC\Auxiliary\Build\vcvars64.bat"

          cmd /c "`"$vcvars`" && set PATH=$nasmPath;%PATH% && cmake -S source -B build\8bit -DENABLE_SHARED=OFF -DENABLE_CLI=ON -DENABLE_ASSEMBLY=ON -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache && cmake --build build\8bit --config ${{ matrix.config }} -j"

          & "build\8bit\${{ matrix.config }}\x265.exe" --version

      - name: Build 10-bit
        if: matrix.variant == '10bit'
        shell: pwsh
        run: |
          $nasmPath = "C:\Program Files\NASM"

          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -property installationPath

          $vcvars = "$vsPath\VC\Auxiliary\Build\vcvars64.bat"

          cmd /c "`"$vcvars`" && set PATH=$nasmPath;%PATH% && cmake -S source -B build\10bit -DHIGH_BIT_DEPTH=ON -DENABLE_SHARED=OFF -DENABLE_CLI=ON -DENABLE_ASSEMBLY=ON -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache && cmake --build build\10bit --config ${{ matrix.config }} -j"

          & "build\10bit\${{ matrix.config }}\x265.exe" --version

      - name: Build 12-bit
        if: matrix.variant == '12bit'
        shell: pwsh
        run: |
          $nasmPath = "C:\Program Files\NASM"

          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -property installationPath

          $vcvars = "$vsPath\VC\Auxiliary\Build\vcvars64.bat"

          cmd /c "`"$vcvars`" && set PATH=$nasmPath;%PATH% && cmake -S source -B build\12bit -DHIGH_BIT_DEPTH=ON -DMAIN12=ON -DENABLE_SHARED=OFF -DENABLE_CLI=ON -DENABLE_ASSEMBLY=ON -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache && cmake --build build\12bit --config ${{ matrix.config }} -j"

          & "build\12bit\${{ matrix.config }}\x265.exe" --version

      - name: Build multilib 12-bit component
        if: matrix.variant == 'multilib-12bit-component'
        shell: pwsh
        run: |
          $nasmPath = "C:\Program Files\NASM"

          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -property installationPath

          $vcvars = "$vsPath\VC\Auxiliary\Build\vcvars64.bat"

          cmd /c "`"$vcvars`" && set PATH=$nasmPath;%PATH% && cmake -S source -B build\multilib\12bit -DCMAKE_BUILD_TYPE=Release -DHIGH_BIT_DEPTH=ON -DMAIN12=ON -DENABLE_SHARED=OFF -DENABLE_CLI=OFF -DEXPORT_C_API=OFF -DENABLE_ASSEMBLY=ON -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache && cmake --build build\multilib\12bit --config Release -j"

      - name: Build multilib 10-bit component
        if: matrix.variant == 'multilib-10bit-component'
        shell: pwsh
        run: |
          $nasmPath = "C:\Program Files\NASM"

          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -property installationPath

          $vcvars = "$vsPath\VC\Auxiliary\Build\vcvars64.bat"

          cmd /c "`"$vcvars`" && set PATH=$nasmPath;%PATH% && cmake -S source -B build\multilib\10bit -DCMAKE_BUILD_TYPE=Release -DHIGH_BIT_DEPTH=ON -DENABLE_SHARED=OFF -DENABLE_CLI=OFF -DEXPORT_C_API=OFF -DENABLE_ASSEMBLY=ON -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache && cmake --build build\multilib\10bit --config Release -j"

      - name: Upload 8-bit artifact
        if: matrix.variant == '8bit'
        uses: actions/upload-artifact@v7
        with:
          name: golden-x265-windows-8bit${{ matrix.config == 'Debug' && '-debug' || '' }}
          path: build/8bit/${{ matrix.config }}/x265.exe
          retention-days: 3

      - name: Upload 10-bit artifact
        if: matrix.variant == '10bit'
        uses: actions/upload-artifact@v7
        with:
          name: golden-x265-windows-10bit${{ matrix.config == 'Debug' && '-debug' || '' }}
          path: build/10bit/${{ matrix.config }}/x265.exe
          retention-days: 3

      - name: Upload 12-bit artifact
        if: matrix.variant == '12bit'
        uses: actions/upload-artifact@v7
        with:
          name: golden-x265-windows-12bit${{ matrix.config == 'Debug' && '-debug' || '' }}
          path: build/12bit/${{ matrix.config }}/x265.exe
          retention-days: 3

      - name: Upload multilib 12-bit component lib
        if: matrix.variant == 'multilib-12bit-component'
        uses: actions/upload-artifact@v7
        with:
          name: golden-x265-windows-multilib-12bit-lib
          path: build/multilib/12bit/Release/x265-static.lib
          retention-days: 3

      - name: Upload multilib 10-bit component lib
        if: matrix.variant == 'multilib-10bit-component'
        uses: actions/upload-artifact@v7
        with:
          name: golden-x265-windows-multilib-10bit-lib
          path: build/multilib/10bit/Release/x265-static.lib
          retention-days: 3


  # ───────────────────────────────────────────────────────────────────────
  # Windows multilib linked build
  # ───────────────────────────────────────────────────────────────────────
  build-windows-multilib:
    name: "Build Windows (multilib, linked)"
    runs-on: windows-latest
    timeout-minutes: 60

    needs: build-windows

    env:
      SCCACHE_DIR: ${{ github.workspace }}\sccache_cache
      SCCACHE_CACHE_SIZE: 2G

    steps:

      - name: Checkout x265
        uses: actions/checkout@v6
        with:
          repository: Multicorewareinc/x265
          ref: ${{ env.X265_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install sccache
        shell: pwsh
        env:
          SCCACHE_VERSION: "0.17.0"
        run: |
          $url = "https://github.com/mozilla/sccache/releases/download/v$($env:SCCACHE_VERSION)/sccache-v$($env:SCCACHE_VERSION)-x86_64-pc-windows-msvc.tar.gz"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile sccache.tar.gz

          tar -xzf sccache.tar.gz

          $sccacheDir = (Get-ChildItem -Directory -Filter "sccache-*").FullName

          echo "$sccacheDir" |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

          & "$sccacheDir\sccache.exe" --start-server

      - name: Install nasm
        shell: pwsh
        run: |
          choco install nasm -y

          $nasmPath = "C:\Program Files\NASM"

          if (Test-Path $nasmPath) {
            echo "$nasmPath" |
              Out-File `
                -FilePath $env:GITHUB_PATH `
                -Encoding utf8 `
                -Append
          }

      - name: Download 12-bit component lib
        uses: actions/download-artifact@v8
        with:
          name: golden-x265-windows-multilib-12bit-lib
          path: build/multilib/12bit/Release

      - name: Download 10-bit component lib
        uses: actions/download-artifact@v8
        with:
          name: golden-x265-windows-multilib-10bit-lib
          path: build/multilib/10bit/Release

      - name: Build multilib 8-bit (linked)
        shell: pwsh
        run: |
          $nasmPath = "C:\Program Files\NASM"

          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -property installationPath

          $vcvars = "$vsPath\VC\Auxiliary\Build\vcvars64.bat"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "build\multilib\8bit" |
            Out-Null

          Copy-Item `
            "build\multilib\10bit\Release\x265-static.lib" `
            "build\multilib\8bit\x265_main10.lib" `
            -Force

          Copy-Item `
            "build\multilib\12bit\Release\x265-static.lib" `
            "build\multilib\8bit\x265_main12.lib" `
            -Force

          $cacheFile = "build\multilib\8bit\init.cmake"

          @"
          set(EXTRA_LIB "x265_main10.lib;x265_main12.lib" CACHE STRING "" FORCE)
          set(EXTRA_LINK_FLAGS "/LIBPATH:." CACHE STRING "" FORCE)
          set(LINKED_10BIT ON CACHE BOOL "" FORCE)
          set(LINKED_12BIT ON CACHE BOOL "" FORCE)
          "@ | Set-Content $cacheFile

          cmd /c "`"$vcvars`" && set PATH=$nasmPath;%PATH% && cmake -S source -B build\multilib\8bit -C build\multilib\8bit\init.cmake -DCMAKE_BUILD_TYPE=Release -DENABLE_SHARED=ON -DENABLE_CLI=ON -DENABLE_ASSEMBLY=ON -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache && cmake --build build\multilib\8bit --config Release -j"

          & "build\multilib\8bit\Release\x265.exe" --version

      - name: Upload multilib artifact
        uses: actions/upload-artifact@v7
        with:
          name: golden-x265-windows-multilib
          path: |
            build/multilib/8bit/Release/x265.exe
            build/multilib/8bit/Release/libx265.dll
          retention-days: 3


  # ───────────────────────────────────────────────────────────────────────
  # Generate goldens - Linux
  # ───────────────────────────────────────────────────────────────────────
  generate-goldens-linux:
    name: "Generate Goldens - Linux"
    runs-on: ubuntu-latest

    if: ${{ github.event.inputs.platforms == 'both' || github.event.inputs.platforms == 'linux' }}

    needs:
      - prep-assets
      - build-linux
      - build-linux-multilib

    timeout-minutes: 120

    env:
      TEST_SEQ_DIR: ${{ github.workspace }}/test-sequences
      GOLDEN_DIR: ${{ github.workspace }}/golden_output
      HARNESS_DIR: ${{ github.workspace }}/test-harness-git
      X265_DIR: ${{ github.workspace }}/x265_src
      DECODER_PATH: ${{ github.workspace }}/test-sequences/TAppDecoder_gcc
      TEMP_DIR: ${{ github.workspace }}/gen_output/temp
      COREDUMP_DIR: ${{ github.workspace }}/gen_output/coredump
      SMOKE_TESTS_FILE: ${{ github.workspace }}/smoke-tests.txt

    steps:

      - name: Validate commit SHA
        run: |
          set -euo pipefail

          if [[ ! "$X265_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::X265_COMMIT must be exactly a 40-character commit SHA"
            echo "Received: $X265_COMMIT"
            exit 1
          fi

          echo "[OK] Commit SHA: $X265_COMMIT"

      - name: Create directories
        run: |
          set -euo pipefail

          mkdir -p \
            "$TEST_SEQ_DIR" \
            "$GOLDEN_DIR" \
            "$TEMP_DIR" \
            "$COREDUMP_DIR"

          echo "[OK] Golden dir is empty:"
          find "$GOLDEN_DIR" -mindepth 1 -maxdepth 1 -print | wc -l

      - name: Clone test-harness
        run: |
          set -euo pipefail

          git clone \
            "${{ secrets.HARNESS_REPO_URL }}" \
            "$HARNESS_DIR"

      - name: Clone x265 and checkout pinned commit
        run: |
          set -euo pipefail

          git clone \
            https://github.com/Multicorewareinc/x265.git \
            "$X265_DIR"

          git -C "$X265_DIR" fetch origin "$X265_COMMIT"

          git -C "$X265_DIR" checkout "$X265_COMMIT"

          ACTUAL_COMMIT=$(git -C "$X265_DIR" rev-parse HEAD)

          if [ "$ACTUAL_COMMIT" != "$X265_COMMIT" ]; then
            echo "::error::x265 checkout does not match requested commit"
            echo "Expected: $X265_COMMIT"
            echo "Actual:   $ACTUAL_COMMIT"
            exit 1
          fi

          echo "[OK] x265 at commit:"
          git -C "$X265_DIR" log --oneline -1

      - name: Download prepped assets
        uses: actions/download-artifact@v8
        with:
          name: golden-gen-assets
          path: assets

      - name: Extract assets
        run: |
          set -euo pipefail

          tar -xz \
            -C "$TEST_SEQ_DIR" \
            -f assets/videos.tar.gz

          tar -xz \
            -C "$TEST_SEQ_DIR" \
            -f assets/decoders-linux.tar.gz

          mkdir -p "$(dirname "$SMOKE_TESTS_FILE")"

          tar -xz \
            -C "$(dirname "$SMOKE_TESTS_FILE")" \
            -f assets/smoke-tests.tar.gz

          mkdir -p /tmp/conf

          tar -xz \
            -C /tmp/conf \
            -f assets/conf.tar.gz

          chmod +x "$DECODER_PATH"

      - name: Configure conf.py
        run: |
          set -euo pipefail

          cp \
            /tmp/conf/linux/conf.py \
            "$HARNESS_DIR/conf.py"

          sed -i \
            "s|my_machine_name.*=.*|my_machine_name      = 'github-runner-goldengen'|" \
            "$HARNESS_DIR/conf.py"

          sed -i \
            "s|my_source.*=.*|my_source            = r'$X265_DIR/source/'|" \
            "$HARNESS_DIR/conf.py"

          sed -i \
            "s|my_sequences.*=.*|my_sequences         = r'$TEST_SEQ_DIR'|" \
            "$HARNESS_DIR/conf.py"

          sed -i \
            "s|my_goldens.*=.*|my_goldens           = r'$GOLDEN_DIR'|" \
            "$HARNESS_DIR/conf.py"

          sed -i \
            "s|my_hm_decoder.*=.*|my_hm_decoder        = r'$DECODER_PATH'|" \
            "$HARNESS_DIR/conf.py"

          sed -i \
            "s|my_jm_decoder.*=.*|my_jm_decoder        = r'$DECODER_PATH'|" \
            "$HARNESS_DIR/conf.py"

          sed -i \
            "s|my_decoder.*=.*|my_decoder           = r'$DECODER_PATH'|" \
            "$HARNESS_DIR/conf.py"

          sed -i \
            "s|my_alpha_decoder.*=.*|my_alpha_decoder     = r'$DECODER_PATH'|" \
            "$HARNESS_DIR/conf.py"

          sed -i \
            "s|my_scc_decoder.*=.*|my_scc_decoder       = r'$DECODER_PATH'|" \
            "$HARNESS_DIR/conf.py"

          sed -i \
            "s|my_multiview_decoder.*=.*|my_multiview_decoder = r'$DECODER_PATH'|" \
            "$HARNESS_DIR/conf.py"

          sed -i \
            "s|my_tempfolder.*=.*|my_tempfolder        = r'$TEMP_DIR/'|" \
            "$HARNESS_DIR/conf.py"

          sed -i \
            "s|my_coredumppath.*=.*|my_coredumppath      = r'$COREDUMP_DIR/'|" \
            "$HARNESS_DIR/conf.py"

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y \
            libnuma-dev

          python3 -m pip install \
            msal \
            requests \
            psutil \
            --break-system-packages

      # Download all Linux build artifacts from THIS workflow run.
      # No gh CLI is required.
      - name: Download Linux build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: golden-x265-linux-*
          path: prebuilt
          merge-multiple: false

      - name: Show downloaded Linux artifacts
        run: |
          set -euo pipefail

          echo "=== Downloaded Linux artifacts ==="

          find prebuilt \
            -maxdepth 3 \
            -type f \
            -print \
            | sort

      - name: Run smoke-test.py for every Linux build config
        run: |
          set -euo pipefail

          declare -A BUILD_ARTIFACT=(
            [gcc]="golden-x265-linux-8bit"
            [gcc_8bit_debug]="golden-x265-linux-8bit-debug"
            [gcc-main10]="golden-x265-linux-10bit"
            [gcc_10bit_debug]="golden-x265-linux-10bit-debug"
            [gccmain12]="golden-x265-linux-12bit"
            [gccmain12_debug]="golden-x265-linux-12bit-debug"
            [gcc-multilib]="golden-x265-linux-multilib"
          )

          declare -A BUILD_FOLDER=(
            [gcc]="gcc"
            [gcc_8bit_debug]="gcc_debug"
            [gcc-main10]="gcc-main10"
            [gcc_10bit_debug]="gcc10_debug"
            [gccmain12]="gccmain12"
            [gccmain12_debug]="gccmain12_debug"
            [gcc-multilib]="gcc-multilib"
          )

          for build in "${!BUILD_ARTIFACT[@]}"; do

            artifact="${BUILD_ARTIFACT[$build]}"
            folder="${BUILD_FOLDER[$build]}"

            dest="$HARNESS_DIR/x265/$folder/default"

            mkdir -p "$dest"

            echo
            echo "======================================================"
            echo "Build:    $build"
            echo "Artifact: $artifact"
            echo "Dest:     $dest"
            echo "======================================================"

            artifact_dir="prebuilt/$artifact"

            if [ ! -d "$artifact_dir" ]; then
              echo "::error::Artifact directory does not exist: $artifact_dir"
              exit 1
            fi

            if [ ! -f "$artifact_dir/x265" ]; then
              echo "::error::x265 binary not found in $artifact_dir"
              find "$artifact_dir" -maxdepth 2 -type f -print
              exit 1
            fi

            cp \
              "$artifact_dir/x265" \
              "$dest/x265"

            chmod +x "$dest/x265"

            if compgen -G "$artifact_dir/libx265.so*" > /dev/null; then
              cp -P \
                "$artifact_dir"/libx265.so* \
                "$dest/"

              export LD_LIBRARY_PATH="$dest:${LD_LIBRARY_PATH:-}"
            fi

            echo "=== x265 binary ==="
            "$dest/x265" --version || true

            echo
            echo "=== Running smoke-test.py for build: $build ==="

            (
              cd "$HARNESS_DIR"

              python3 smoke-test.py \
                -b "$build" \
                --no-make \
                --no-bench
            ) || {
              echo "::warning::smoke-test.py reported issues for $build"
              echo "::warning::Check harness logs. Goldens may still have been written."
            }

          done

      - name: Package goldens-linux.tar.gz
        run: |
          set -euo pipefail

          COUNT=$(find "$GOLDEN_DIR" -type f | wc -l)

          echo "[INFO] $COUNT golden files generated"

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No golden files were generated"
            exit 1
          fi

          tar -czf \
            goldens-linux.tar.gz \
            -C "$GOLDEN_DIR" .

          ls -lh goldens-linux.tar.gz

      - name: Upload goldens-linux.tar.gz
        uses: actions/upload-artifact@v7
        with:
          name: goldens-linux
          path: goldens-linux.tar.gz
          retention-days: 14

      - name: Upload harness logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: golden-gen-linux-logs
          path: ${{ env.HARNESS_DIR }}/x265/log-*.txt
          if-no-files-found: ignore
          retention-days: 7


  # ───────────────────────────────────────────────────────────────────────
  # Generate goldens - Windows
  # ───────────────────────────────────────────────────────────────────────
  generate-goldens-windows:
    name: "Generate Goldens - Windows"
    runs-on: windows-2022

    if: ${{ github.event.inputs.platforms == 'both' || github.event.inputs.platforms == 'windows' }}

    needs:
      - prep-assets
      - build-windows
      - build-windows-multilib

    timeout-minutes: 150

    defaults:
      run:
        shell: bash

    env:
      TEST_SEQ_DIR: ${{ github.workspace }}\test-sequences
      GOLDEN_DIR: ${{ github.workspace }}\golden_output
      HARNESS_DIR: ${{ github.workspace }}\test-harness-git
      X265_DIR: ${{ github.workspace }}\x265_src
      DECODER_PATH: ${{ github.workspace }}\test-sequences\TAppDecoder.exe
      TEMP_DIR: ${{ github.workspace }}\gen_output\temp
      COREDUMP_DIR: ${{ github.workspace }}\gen_output\coredump
      SMOKE_TESTS_FILE: ${{ github.workspace }}\smoke-tests.txt

    steps:

      - name: Validate commit SHA
        run: |
          set -euo pipefail

          if [[ ! "$X265_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::X265_COMMIT must be exactly a 40-character commit SHA"
            echo "Received: $X265_COMMIT"
            exit 1
          fi

          echo "[OK] Commit SHA: $X265_COMMIT"

      - name: Create directories
        run: |
          set -euo pipefail

          mkdir -p \
            "$TEST_SEQ_DIR" \
            "$GOLDEN_DIR" \
            "$TEMP_DIR" \
            "$COREDUMP_DIR"

          echo "[OK] Golden directory created."

      - name: Clone test-harness
        run: |
          set -euo pipefail

          git clone \
            "${{ secrets.HARNESS_REPO_URL }}" \
            "$HARNESS_DIR"

      - name: Clone x265 and checkout pinned commit
        run: |
          set -euo pipefail

          git clone \
            https://github.com/Multicorewareinc/x265.git \
            "$X265_DIR"

          git -C "$X265_DIR" fetch origin "$X265_COMMIT"

          git -C "$X265_DIR" checkout "$X265_COMMIT"

          ACTUAL_COMMIT=$(git -C "$X265_DIR" rev-parse HEAD)

          if [ "$ACTUAL_COMMIT" != "$X265_COMMIT" ]; then
            echo "::error::x265 checkout does not match requested commit"
            echo "Expected: $X265_COMMIT"
            echo "Actual:   $ACTUAL_COMMIT"
            exit 1
          fi

          echo "[OK] x265 at commit:"
          git -C "$X265_DIR" log --oneline -1

      - name: Download prepped assets
        uses: actions/download-artifact@v8
        with:
          name: golden-gen-assets
          path: assets

      - name: Extract assets
        run: |
          set -euo pipefail

          extract() {
            local archive="$1"
            local destination="$2"

            local dest
            dest=$(cygpath -u "$destination")

            mkdir -p "$dest"

            tar -xz \
              -C "$dest" \
              -f "assets/$archive"
          }

          extract \
            "videos.tar.gz" \
            "$TEST_SEQ_DIR"

          extract \
            "decoders-windows.tar.gz" \
            "$TEST_SEQ_DIR"

          mkdir -p "$(dirname "$SMOKE_TESTS_FILE")"

          extract \
            "smoke-tests.tar.gz" \
            "$(dirname "$SMOKE_TESTS_FILE")"

          mkdir -p /tmp/conf

          extract \
            "conf.tar.gz" \
            "/tmp/conf"

      - name: Find vcvarsall.bat
        run: |
          set -euo pipefail

          VCVARS=$(find \
            "C:/Program Files/Microsoft Visual Studio" \
            -name "vcvarsall.bat" \
            2>/dev/null \
            | head -1)

          if [ -z "$VCVARS" ]; then
            echo "::error::Could not find vcvarsall.bat"
            exit 1
          fi

          echo "VCVARSALL_PATH=$(cygpath -m "$VCVARS")" >> "$GITHUB_ENV"

          echo "[OK] VCVARSALL_PATH=$VCVARS"

      - name: Configure conf.py
        run: |
          set -euo pipefail

          cp \
            /tmp/conf/windows/conf.py \
            "$HARNESS_DIR/conf.py"

          sed -i \
            "s|my_machine_name.*=.*|my_machine_name      = 'github-runner-goldengen'|" \
            "$HARNESS_DIR/conf.py"

          WIN_X265_DIR=$(cygpath -m "$X265_DIR")
          WIN_TEST_SEQ_DIR=$(cygpath -m "$TEST_SEQ_DIR")
          WIN_GOLDEN_DIR=$(cygpath -m "$GOLDEN_DIR")
          WIN_DECODER_PATH=$(cygpath -m "$DECODER_PATH")
          WIN_TEMP_DIR=$(cygpath -m "$TEMP_DIR")
          WIN_COREDUMP_DIR=$(cygpath -m "$COREDUMP_DIR")

          python3 - << 'EOF'
          import os
          import re

          conf = os.environ["HARNESS_DIR"].replace("\\", "/") + "/conf.py"
          vcvars = os.environ["VCVARSALL_PATH"]

          with open(conf, "r", encoding="utf-8") as f:
              content = f.read()

          content = re.sub(
              r"^(?!#)\s*my_vcvarsall\s*=.*$",
              f"my_vcvarsall         = r'{vcvars}'",
              content,
              flags=re.MULTILINE,
          )

          with open(conf, "w", encoding="utf-8") as f:
              f.write(content)
          EOF

          sed -i \
            "s|my_source.*=.*|my_source            = r'${WIN_X265_DIR}/source/'|" \
            "$HARNESS_DIR/conf.py"

          sed -i \
            "s|my_sequences.*=.*|my_sequences         = r'${WIN_TEST_SEQ_DIR}'|" \
            "$HARNESS_DIR/conf.py"

          sed -i \
            "s|my_goldens.*=.*|my_goldens           = r'${WIN_GOLDEN_DIR}'|" \
            "$HARNESS_DIR/conf.py"

          sed -i \
            "s|my_hm_decoder.*=.*|my_hm_decoder        = r'${WIN_DECODER_PATH}'|" \
            "$HARNESS_DIR/conf.py"

          sed -i \
            "s|my_jm_decoder.*=.*|my_jm_decoder        = r'${WIN_DECODER_PATH}'|" \
            "$HARNESS_DIR/conf.py"

          sed -i \
            "s|my_decoder.*=.*|my_decoder           = r'${WIN_DECODER_PATH}'|" \
            "$HARNESS_DIR/conf.py"

          sed -i \
            "s|my_alpha_decoder.*=.*|my_alpha_decoder     = r'${WIN_DECODER_PATH}'|" \
            "$HARNESS_DIR/conf.py"

          sed -i \
            "s|my_scc_decoder.*=.*|my_scc_decoder       = r'${WIN_DECODER_PATH}'|" \
            "$HARNESS_DIR/conf.py"

          sed -i \
            "s|my_multiview_decoder.*=.*|my_multiview_decoder = r'${WIN_DECODER_PATH}'|" \
            "$HARNESS_DIR/conf.py"

          sed -i \
            "s|my_tempfolder.*=.*|my_tempfolder        = r'${WIN_TEMP_DIR}/'|" \
            "$HARNESS_DIR/conf.py"

          sed -i \
            "s|my_coredumppath.*=.*|my_coredumppath      = r'${WIN_COREDUMP_DIR}/'|" \
            "$HARNESS_DIR/conf.py"

      - name: Patch utils.py vcpath and msbuild
        run: |
          set -euo pipefail

          python3 - << 'EOF'
          import os

          utils = (
              os.environ["HARNESS_DIR"]
              .replace("\\", "/")
              + "/utils.py"
          )

          vcvars_dir = os.path.dirname(
              os.environ["VCVARSALL_PATH"]
          )

          vs_root = (
              vcvars_dir
              .replace("/", "\\")
              .split("VC\\Auxiliary\\Build")[0]
          )

          msbuild = (
              vs_root
              + r"MSBuild\Current\Bin\amd64\MSBuild.exe"
          )

          with open(utils, "r", encoding="utf-8") as f:
              content = f.read()

          content = content.replace(
              r"vcpath = r'C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build'",
              f"vcpath = r'{vcvars_dir}'",
          )

          content = content.replace(
              r"r'C:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\amd64\MSBuild.exe'",
              f"r'{msbuild}'",
          )

          with open(utils, "w", encoding="utf-8") as f:
              f.write(content)
          EOF

      - name: Install dependencies
        run: |
          python3 -m pip install \
            msal \
            requests \
            psutil \
            setuptools

      # Download all Windows build artifacts from THIS workflow run.
      - name: Download Windows build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: golden-x265-windows-*
          path: prebuilt
          merge-multiple: false

      - name: Show downloaded Windows artifacts
        run: |
          set -euo pipefail

          echo "=== Downloaded Windows artifacts ==="

          find prebuilt \
            -maxdepth 3 \
            -type f \
            -print \
            | sort

      - name: Run smoke-test.py for every Windows build config
        run: |
          set -euo pipefail

          declare -A BUILD_ARTIFACT=(
            [vc17_64_8bpp]="golden-x265-windows-8bit"
            [vc17_64_8bpp_debug]="golden-x265-windows-8bit-debug"
            [vc17_64_16bpp]="golden-x265-windows-10bit"
            [vc17_64_16bpp_debug]="golden-x265-windows-10bit-debug"
            [vc17_64_main12]="golden-x265-windows-12bit"
            [vc17_64_main12_debug]="golden-x265-windows-12bit-debug"
            [vc17_64_multilib]="golden-x265-windows-multilib"
          )

          WIN_SMOKE_TESTS_FILE=$(cygpath -m "$SMOKE_TESTS_FILE")

          for build in "${!BUILD_ARTIFACT[@]}"; do

            artifact="${BUILD_ARTIFACT[$build]}"

            case "$build" in
              *_debug)
                target="Debug"
                ;;
              *)
                target="Release"
                ;;
            esac

            dest="$HARNESS_DIR/x265/$build/default/$target"

            mkdir -p "$dest"

            echo
            echo "======================================================"
            echo "Build:    $build"
            echo "Artifact: $artifact"
            echo "Dest:     $dest"
            echo "======================================================"

            artifact_dir="prebuilt/$artifact"

            if [ ! -d "$artifact_dir" ]; then
              echo "::error::Artifact directory does not exist: $artifact_dir"
              exit 1
            fi

            if [ ! -f "$artifact_dir/x265.exe" ]; then
              echo "::error::x265.exe not found in $artifact_dir"
              find "$artifact_dir" -maxdepth 2 -type f -print
              exit 1
            fi

            cp \
              "$artifact_dir/x265.exe" \
              "$dest/x265.exe"

            if [ -f "$artifact_dir/libx265.dll" ]; then
              cp \
                "$artifact_dir/libx265.dll" \
                "$dest/libx265.dll"
            fi

            echo "=== x265 version ==="

            "$dest/x265.exe" --version || true

            echo
            echo "=== Running smoke-test.py for build: $build ==="

            (
              cd "$HARNESS_DIR"

              python3 smoke-test.py \
                -b "$build" \
                --no-make \
                --no-bench
            ) || {
              echo "::warning::smoke-test.py reported issues for $build"
              echo "::warning::Check harness logs. Goldens may still have been written."
            }

          done

      - name: Package goldens-windows.tar.gz
        run: |
          set -euo pipefail

          COUNT=$(find "$GOLDEN_DIR" -type f | wc -l)

          echo "[INFO] $COUNT golden files generated"

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No golden files were generated"
            exit 1
          fi

          tar -czf \
            goldens-windows.tar.gz \
            -C "$GOLDEN_DIR" .

          ls -lh goldens-windows.tar.gz

      - name: Upload goldens-windows.tar.gz
        uses: actions/upload-artifact@v7
        with:
          name: goldens-windows
          path: goldens-windows.tar.gz
          retention-days: 14

      - name: Upload harness logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: golden-gen-windows-logs
          path: ${{ env.HARNESS_DIR }}/x265/log-*.txt
          if-no-files-found: ignore
          retention-days: 7
